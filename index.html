<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 2</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
            padding: 50px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        button {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #result {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            border-radius: 8px;
            background-color: #eeeeee;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Question 2</h1>

    <p>How many sides does a parallelogram have?</p>

    <button onclick="answer('A')">A. 3</button>
    <button onclick="answer('B')">B. 4</button>
    <button onclick="answer('C')">C. 5</button>
    <button onclick="answer('D')">D. 6</button>

    <p id="result"></p>

</div>

<script>
function answer(choice) {

    let result = document.getElementById("result");

    if (choice === "A") {
        result.innerHTML = "Not quite! A three-sided shape is a triangle.";
    }
    else if (choice === "B") {
        result.innerHTML = "Correct! A parallelogram is a quadrilateral, so it has four sides. Here's your clue, 2A";
    }
    else if (choice === "C") {
        result.innerHTML = "Nope! A five-sided shape is a pentagon.";
    }
    else {
        result.innerHTML = "Not quite! A six-sided shape is a hexagon.";
    }
}
</script>

</body>
</html>
